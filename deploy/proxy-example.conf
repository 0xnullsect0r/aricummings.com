# Example nginx config for aricummings.com, for the host nginx in front of the
# containers. The containers are bound to 127.0.0.1:8080 (public) and
# 127.0.0.1:8081 (admin).
#
# http-level (put outside all server blocks):
#   limit_req_zone $binary_remote_addr zone=ari_api:10m rate=20r/s;

# The public site: www is the main address.
server {
    listen 80;
    listen [::]:80;
    server_name www.aricummings.com;

    # X-Forwarded-For must be OVERWRITTEN with $remote_addr, never appended:
    # the API reads the first value, and appending lets clients forge their IP.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Coarse flood stop in front of the app's own limits.
    location /api/ {
        limit_req zone=ari_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Match the API's upload limit (40 MB media uploads).
    client_max_body_size 41m;
}

# Bare domain and the alternate domain redirect to www.
server {
    listen 80;
    listen [::]:80;
    server_name aricummings.com arigreenecummings.com www.arigreenecummings.com;
    return 301 $scheme://www.aricummings.com$request_uri;
}

# Admin: own subdomain, own port, locked to the VPN or known addresses.
server {
    listen 80;
    listen [::]:80;
    server_name admin.aricummings.com;

    # allow 10.8.0.0/24;   # wireguard/tailscale range, whatever the homelab uses
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS: certificates via certbot --nginx for all names; HSTS on the public block:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
